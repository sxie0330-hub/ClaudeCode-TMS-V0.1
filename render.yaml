# Render Blueprint — FREE test setup (Dashboard → New → Blueprint → pick this repo).
#
# Free plan limits: the web service sleeps after 15 min idle (first visit then
# takes ~1 min); the free Postgres expires 30 days after creation (14-day grace
# period, then deleted). Good for internal testing only.
#
# Going live: change the web plan to "starter" and the database plan to
# "basic-256mb", and use a fresh paid database for real data.
services:
  - type: web
    name: tms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Migrations run on every start so this works on the free plan too.
    startCommand: python manage.py migrate --noinput && gunicorn tms.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DATABASE_URL
        fromDatabase:
          name: tms-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TMS_ALLOWED_EMAIL_DOMAINS
        value: advtransolution.com
      - key: TMS_BOOTSTRAP_ADMINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TMS_COMPANY_ADDRESS
        sync: false
      - key: TMS_COMPANY_PHONE
        sync: false

databases:
  - name: tms-db
    plan: free
    postgresMajorVersion: "16"
