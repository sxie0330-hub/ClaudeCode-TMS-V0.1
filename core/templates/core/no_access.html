{% extends "core/base.html" %}
{% block content %}
<div class="login">
  <h1>等待分配权限</h1>
  <p class="muted">你已用 {{ user.email }} 登录，但管理员还没有给你分配角色。请联系管理层在「团队」页面为你设置角色。</p>
  <form method="post" action="{% url 'account_logout' %}">{% csrf_token %}<button class="btn" type="submit">退出</button></form>
</div>
{% endblock %}
