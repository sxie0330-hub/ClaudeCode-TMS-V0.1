{% extends "core/base.html" %}
{% block title %}导入数据{% endblock %}
{% block content %}
<div class="head"><h1>导入项目和 Load（JSON）</h1></div>
<div class="panel"><div class="body form">
  <div class="intro">上传按约定格式整理好的 .json 文件（例如从 Notion 导出整理的项目）。同名项目已存在时自动跳过，重复上传不会产生重复数据。先勾"只预览"看看会导入什么。</div>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    <div class="f"><label for="file">JSON 文件</label><input id="file" type="file" name="file" accept=".json" required></div>
    <label style="display:block;margin-top:8px"><input type="checkbox" name="dry_run" value="1"> 只预览，不写入</label>
    <label style="display:block;margin-top:8px"><input type="checkbox" name="wipe" value="1"> 导入前<b>清空所有客户、项目、Load 和费用</b>（仅测试期使用，不可恢复）</label>
    <div class="f" style="margin-top:6px;max-width:260px"><label for="confirm">清空确认：输入 DELETE</label><input id="confirm" name="confirm" autocomplete="off"></div>
    <div class="buttons"><button class="primary" type="submit">开始</button></div>
  </form>
  {% if output %}<pre style="white-space:pre-wrap;background:#f6f7f9;padding:10px;border-radius:5px;margin-top:14px">{{ output }}</pre>{% endif %}
</div></div>
{% endblock %}
