{% extends "core/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="head"><h1>{{ title }}</h1></div>
<div class="panel"><div class="body">
  <p>{{ text }}</p>
  <form method="post">{% csrf_token %}
    <button type="submit" class="{% if danger %}danger{% else %}primary{% endif %}">确认</button>
    <a class="btn" href="{{ cancel_url }}">取消</a>
  </form>
</div></div>
{% endblock %}
